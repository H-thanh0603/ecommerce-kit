# Provider postgresql là bắt buộc sau cutover → MẶC ĐỊNH: app + db (Postgres) trong 1 lệnh.
#   cp .env.example .env   # điền POSTGRES_PASSWORD, AUTH_SECRET, APP_URL
#   docker compose up -d --build
# Chi tiết (seed, migrate:all, tenant): DEPLOY.md §2 + §10.
services:
  app:
    build: .
    ports:
      # Bind loopback + reverse proxy (nginx/caddy) phía trước; đổi sang "80:3000" nếu expose trực tiếp.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Ghi đè DATABASE_URL của host (.env trỏ localhost — trong container phải trỏ service db).
      # DB ngoài (Neon/Supabase/Vercel) → không dùng compose app, xem DEPLOY.md §3.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ek}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ek}?schema=public
    depends_on:
      - db
    volumes:
      - ek-uploads:/app/public/uploads
    restart: unless-stopped

  # Postgres 16 — mặc định (không còn nằm sau profile `pg`).
  # Không publish 5432 ra host ngoài (least-privilege Q70) — truy cập qua `docker compose exec db psql`.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD bắt buộc}
      POSTGRES_DB: ${POSTGRES_DB:-ek}
    volumes:
      - ek-pg:/var/lib/postgresql/data
    # ports: chỉ bật khi cần truy cập từ ngoài container network
    # ports:
    #   - "127.0.0.1:5432:5432"

volumes:
  ek-uploads:
  ek-pg:
