name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./dev.db
      - run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: file:./dev.db
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
